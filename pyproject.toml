[project]
name = "joblens"
version = "0.1.0"
description = "AI assistant for the Dutch job market: vacancy extraction, CV matching (RAG), agents and MCP tools."
readme = "README.md"
authors = [
    { name = "Mohammed Mahdi", email = "125477617+TheBanker1945@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "openai>=3.14.1",
    "pdfminer-six>=20260107",
    "protego>=0.7.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
# Only needed to scrape Indeed/LinkedIn: uv sync --group scrape
# Not installed by default, so the library, the tests and the evals stay on the
# dependencies above. (protego, since 5.5: robots.txt as RFC 9309 reads it,
# wildcards included, which the standard library's robotparser does not do.)
scrape = [
    "python-jobspy",
]

[tool.ruff.lint]
# E/F: default errors, I: import sorting, UP: modern Python syntax, B: common bugs
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# Pinned to a commit, not to PyPI: the last release (1.1.82, July 2025) requires
# numpy==1.26.3, which would drag this project back from numpy 2. Resolving it from
# PyPI silently installs python-jobspy 1.1.13 from 2024 instead. A commit also means
# an upstream change can never surprise us mid-run.
python-jobspy = { git = "https://github.com/speedyapply/JobSpy", rev = "fda080a373e8226f3fd60635323f5da9af9892b1" }
