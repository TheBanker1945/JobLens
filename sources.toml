# Where vacancies come from. All of these are public endpoints: no key, no
# registration, no trial. Adding a company is one line here.
#
# Fetching rules: one request per company, a pause in between, a User-Agent that
# names the project, and nothing is fetched twice (see data/raw/, never committed).

delay_seconds = 1.5

# Dutch filter for boards that are global (Greenhouse lists jobs worldwide).
# A vacancy is kept when country is NL, or the location mentions one of these.
[netherlands]
markers = [
    "Netherlands", "Nederland", "Holland",
    "Amsterdam", "Rotterdam", "Den Haag", "The Hague", "Utrecht", "Eindhoven",
    "Groningen", "Tilburg", "Almere", "Breda", "Nijmegen", "Arnhem", "Haarlem",
    "Zwolle", "Delft", "Leiden", "Amersfoort", "Apeldoorn", "Enschede",
]

# Company career pages on Recruitee: {slug}.recruitee.com/api/offers/
[[recruitee]]
slug = "channable"
[[recruitee]]
slug = "nmbrs"
[[recruitee]]
slug = "vandebron"

# Company boards on Greenhouse: boards-api.greenhouse.io/v1/boards/{slug}/jobs
[[greenhouse]]
slug = "adyen"
[[greenhouse]]
slug = "catawiki"
[[greenhouse]]
slug = "databricks"

# Aggregator; anonymous tier, ~10 requests/hour per IP, 20 jobs each. Used next to
# the boards above for sector variety (they skew towards tech), never depended on.
[jobdataapi]
enabled = true
country = "NL"
max_age_days = 7

# Scraped sources: Indeed and LinkedIn publish no feed, so these read the
# endpoints their own app and logged-out pages use, through JobSpy. They need the
# optional dependency group: uv sync --group scrape
#
# Volume stays small on purpose: a few searches, a radius in kilometres (JobSpy
# counts miles and defaults to 50, which is most of the Netherlands), and only
# vacancies from the last few days.

[indeed]
enabled = true
country = "netherlands"
distance_km = 25
# A week rather than three days: the searches below are narrow (junior developer
# roles in one corner of the Randstad) and a 72-hour window returns single
# figures for them. Widen it back if a run starts costing too much to index.
hours_old = 168
results_per_search = 50

# One search is one request that brings back up to 100 jobs with their
# descriptions. Deliberately not all tech: the ATS boards above already are.
[[indeed.searches]]
term = "data engineer"
city = "Amsterdam"
[[indeed.searches]]
term = "verpleegkundige"
city = "Utrecht"
[[indeed.searches]]
term = "monteur"
city = "Eindhoven"
[[indeed.searches]]
term = "beleidsmedewerker"
city = "Den Haag"

# Junior developer roles around Den Haag / Rotterdam / Leiden. Added 2026-09-22
# because the corpus held almost no junior dev work, so matching a junior
# full-stack CV against it could only ever answer "nothing here fits" -- a true
# answer that measures nothing. The searches above stay: the labelled queries and
# CV labels from 3.1-3.5 refer to what they brought in.
# Broad terms on purpose: "junior software developer" returned zero listings
# where "software developer" returns plenty. Indeed matches a long phrase
# literally, and seniority is better filtered by reading the vacancy than by
# hoping the board agrees with the word.
[[indeed.searches]]
term = "software developer"
city = "Rotterdam"
[[indeed.searches]]
term = "frontend developer"
city = "Den Haag"
[[indeed.searches]]
term = "webdeveloper"
city = "Den Haag"
[[indeed.searches]]
term = "full stack developer"
city = "Amsterdam"
[[indeed.searches]]
term = "python developer"
city = "Amsterdam"
[[indeed.searches]]
term = "javascript developer"
city = "Amsterdam"
[[indeed.searches]]
term = "react developer"
city = "Amsterdam"
[[indeed.searches]]
term = "software engineer"
city = "Utrecht"

# Off by default, on purpose. LinkedIn's guest endpoints are the throttle-prone
# half of scraping and its terms do not invite it, so switching this on is a
# deliberate choice about your own IP. What it costs is capped: jobs already in
# data/raw/ are never requested again, a run fetches at most
# max_descriptions_per_run descriptions, and delay_seconds sits between them.
[linkedin]
enabled = false
distance_km = 25
hours_old = 72
results_per_search = 25
max_descriptions_per_run = 40
delay_seconds = 2.5

[[linkedin.searches]]
term = "data engineer"
city = "Amsterdam"
[[linkedin.searches]]
term = "product manager"
city = "Rotterdam"
