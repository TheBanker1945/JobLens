# Where vacancies come from. All of these are public endpoints: no key, no
# registration, no trial. The employer boards (Recruitee, Greenhouse,
# SmartRecruiters) are listed in boards.toml since 5.3; this file holds the
# settings and the searches.
#
# Fetching rules: one request per company, a User-Agent that names the project,
# nothing is fetched twice (see data/raw/, never committed), and every request
# passes the gate configured below.

# The gate every request passes (src/joblens/sources/polite.py). All numbers are
# per *site*, and a site is the platform: every *.recruitee.com board is one site.
# A site that refuses us (429, 403, a challenge page) is written to
# data/raw/fetch-state.json and left alone for first_cooldown_hours, doubling
# with each refusal in a row up to max_cooldown_days. Delete its entry there to
# ask again sooner. Nothing here gets around a refusal: no proxies, no retries.
[politeness]
delay_seconds = 1.5          # between two requests to the same site
jitter_seconds = 1.0         # plus up to this much, so requests do not tick
max_requests_per_site = 200  # per run; a runaway loop stops here
first_cooldown_hours = 12    # refused once: tried again the next night
max_cooldown_days = 7

# Anonymous tier: ~10 requests an hour per IP, and refused ones count too (2.3).
[politeness.sites."jobdataapi.com"]
max_requests = 8

# europa.eu's robots.txt asks every crawler for Crawl-delay: 10. EURES is not a
# crawl, but it is not a documented API either (sources/eures.py): its pace.
[politeness.sites."europa.eu"]
delay_seconds = 10
max_requests = 20

# Dutch filter for boards that are global (Greenhouse lists jobs worldwide).
# A vacancy is kept when country is NL, or the location mentions one of these.
[netherlands]
markers = [
    "Netherlands", "Nederland", "Holland",
    "Amsterdam", "Rotterdam", "Den Haag", "The Hague", "Utrecht", "Eindhoven",
    "Groningen", "Tilburg", "Almere", "Breda", "Nijmegen", "Arnhem", "Haarlem",
    "Zwolle", "Delft", "Leiden", "Amersfoort", "Apeldoorn", "Enschede",
]

# Which *new* vacancies are stored (src/joblens/sources/scope.py). Decided by
# Mahdi on 2026-09-22: four provinces, software and AI engineering and similar.
# Stored vacancies are never removed by this; what it leaves out is counted and
# named in the run report. Only a vacancy that is stored gets extracted and
# embedded, at ~0.27 cent each, so this is also the cost gate.
[scope]
# Province names as CBS writes them (src/joblens/sources/places_nl.csv).
provinces = ["Zuid-Holland", "Noord-Holland", "Utrecht", "Zeeland"]
# A title is in scope when it holds one of these words and none of `not_roles`.
# Three letters or fewer must stand alone ("ai"); longer ones may sit inside a
# Dutch compound ("Softwareontwikkelaar"). That is also the trap: a longer word
# matches inside any word, so "rust" (Rustoord), "scala" (Escalatie) and "react"
# (Reactor) are left out on purpose -- "developer" or "engineer" catches those
# jobs anyway. Measured on 404 stored titles and Mahdi's own labels, 2026-09-22.
roles = [
    "developer", "ontwikkelaar", "programmeur", "programmer", "software",
    "engineer", "engineering", "devops", "full stack", "fullstack", "frontend",
    "front end", "backend", "back end", "data scientist", "data science",
    "machine learning", "ai", "ml", "llm", "nlp", "mlops", "sre", "qa",
    "site reliability", "python", "java", "javascript", "typescript", "golang",
    "kotlin", "haskell", "php", "ios", "android", "flutter", "angular",
    "software architect", "solution architect", "solutions architect",
    "cloud architect", "data architect", "ci/cd", "platform team",
]
# Engineers and developers of other things, and jobs *about* developers. Whole
# phrases rather than loose words: "sales" alone would also throw out
# "Salesforce Developer".
not_roles = [
    "business developer", "business development", "beleidsontwikkelaar",
    "vastgoed", "projectontwikkelaar", "planontwikkel", "organisatieontwikkel",
    "onderwijsontwikkel", "productontwikkelaar", "service engineer",
    "field service", "servicemonteur", "monteur", "mechanical", "werktuigbouw",
    "elektrotechn", "electrical", "process engineer", "procesengineer", "civil",
    "civiel", "installatie", "hvac", "hydraul", "waterbouw", "geotechn", "kabels",
    # read in the EURES titles, 2026-09-23; "offshore" and "project engineer"
    # are not here on purpose: "Junior Software Engineer - Maritieme, Offshore-
    # en Industriele Automatisering" is software work, and so can the other be
    "proces engineer", "kabelwerken", "cost engineer", "structural", "dredging",
    "werkvoorbereider", "building automation",
    "facility", "sheq", "hardware", "cnc", "sales engineer",
    "sales manager", "sales executive", "presales", "pre sales",
    "account manager", "account executive", "accountant", "product manager",
    "product owner", "recruit", "docent", "teacher", "lecturer",
]

# Government vacancies (src/joblens/sources/overheid.py). werkenbijdeoverheid.nl
# lists every vacancy in one sitemap; the scope runs on the title in each URL
# before a page is asked for. The first source that *crawls*: robots.txt applies
# (it allows everything, Request-rate 10/1). --limit caps the pages per run.
[overheid]
enabled = true
sitemap = "https://www.werkenbijdeoverheid.nl/sitemap-vacatures.xml"

# Aggregator; anonymous tier, ~10 requests/hour per IP, 20 jobs each, no paging.
# One request per title below, so each brings different vacancies.
[jobdataapi]
enabled = true
country = "NL"
max_age_days = 7
# Until 5.2 these were nursing, technicians, logistics, teaching, advice and one
# "developer", for sector variety. The scope (above) would now throw most of that
# away after paying a request for it, so the titles follow the scope instead.
titles = [
    "developer", "software engineer", "data engineer", "machine learning",
    "ontwikkelaar", "devops",
]

# EURES, the EU job portal, which carries werk.nl's vacancies (sources/eures.py).
# One search per title below, matched in the job title only, in the provinces of
# [scope] (EURES filters on the region itself). The texts are summaries of about
# 2,000 characters, so they complete the corpus rather than lead it.
[eures]
enabled = true
max_age_days = 60       # by creation date; "last week" at EURES means last change
pages_per_search = 2    # 50 each; a quiet week lists fewer than 50 per title
# EURES matches the words of a title one by one, not as a phrase (2026-09-23):
# "data engineer" brought 61 records "software engineer" had already stored, and
# "machine learning" 100 records of which 2 were the work (machine operators).
# Both are left out; these four stored 216 of the 219 in-scope vacancies.
titles = ["developer", "software engineer", "ontwikkelaar", "devops"]

# Scraped sources: Indeed and LinkedIn publish no feed, so these read the
# endpoints their own app and logged-out pages use, through JobSpy. They need the
# optional dependency group: uv sync --group scrape
#
# Volume stays small on purpose: a radius in kilometres (JobSpy counts miles and
# defaults to 50, which is most of the Netherlands), and only recent vacancies.

[indeed]
enabled = true
country = "netherlands"
distance_km = 25
# A week rather than three days: narrow searches in a 72-hour window return
# single figures. Jobs already stored cost nothing to see again.
hours_old = 168
results_per_search = 50

# One search is one request that brings back up to 100 jobs with descriptions.
# Since 5.2 they follow the scope (four provinces, software and AI work). The
# nursing, technician and policy searches of 2.4 are gone; the vacancies they
# brought in stay stored, so the labels of 3.1-3.5 still find them.
# Broad terms on purpose: Indeed matches a long phrase literally ("junior
# software developer" returned nothing where "software developer" returned
# plenty), and seniority is better read from the vacancy than from the search.
# One hub per region: 25 km around Den Haag covers Leiden and Delft, around
# Amsterdam Haarlem and Hoofddorp, around Utrecht Amersfoort and Hilversum.
[[indeed.searches]]
term = "developer"
city = "Amsterdam"
[[indeed.searches]]
term = "software engineer"
city = "Amsterdam"
[[indeed.searches]]
term = "data engineer"
city = "Amsterdam"
[[indeed.searches]]
term = "machine learning"
city = "Amsterdam"
[[indeed.searches]]
term = "AI engineer"
city = "Amsterdam"
[[indeed.searches]]
term = "developer"
city = "Rotterdam"
[[indeed.searches]]
term = "software engineer"
city = "Rotterdam"
[[indeed.searches]]
term = "data engineer"
city = "Rotterdam"
[[indeed.searches]]
term = "machine learning"
city = "Rotterdam"
[[indeed.searches]]
term = "AI engineer"
city = "Rotterdam"
[[indeed.searches]]
term = "developer"
city = "Den Haag"
[[indeed.searches]]
term = "software engineer"
city = "Den Haag"
[[indeed.searches]]
term = "data engineer"
city = "Den Haag"
[[indeed.searches]]
term = "machine learning"
city = "Den Haag"
[[indeed.searches]]
term = "AI engineer"
city = "Den Haag"
[[indeed.searches]]
term = "developer"
city = "Utrecht"
[[indeed.searches]]
term = "software engineer"
city = "Utrecht"
[[indeed.searches]]
term = "data engineer"
city = "Utrecht"
[[indeed.searches]]
term = "machine learning"
city = "Utrecht"
[[indeed.searches]]
term = "AI engineer"
city = "Utrecht"
# Zeeland is a small market for this work: two broad searches around Middelburg
# (25 km reaches Vlissingen and Goes).
[[indeed.searches]]
term = "developer"
city = "Middelburg"
[[indeed.searches]]
term = "software engineer"
city = "Middelburg"

# Off by default, on purpose, and staying off (decided 2026-09-22). LinkedIn's
# guest endpoints are the throttle-prone half of scraping, its terms do not
# invite it, and its robots.txt disallows /jobs-guest/ for every crawler,
# Googlebot included. Switching this on is a deliberate choice about your own
# IP. What it costs is capped: jobs already in data/raw/ are never requested
# again, a run fetches at most max_descriptions_per_run descriptions, and
# delay_seconds sits between them.
[linkedin]
enabled = false
distance_km = 25
hours_old = 72
results_per_search = 25
max_descriptions_per_run = 40
delay_seconds = 2.5

[[linkedin.searches]]
term = "data engineer"
city = "Amsterdam"
[[linkedin.searches]]
term = "software engineer"
city = "Rotterdam"
