# The database JobLens's web app keeps its users, CVs, runs and labels in, on
# your own machine:
#
#     docker compose up -d db        # start it (the data survives restarts)
#     uv run python scripts/db.py migrate
#
# (`docker-compose` with a dash, the older standalone command, reads this too.)
# The container and its volume have fixed names, so every checkout and worktree
# of the repo shares one database instead of each starting an empty one.
#
# Hosted, the same schema runs on Neon (docs/web-app-phase-7.md); only
# DATABASE_URL changes. The password below is for a database that only this
# machine can reach -- the port is bound to 127.0.0.1 -- and never for Neon.
#
# Port 54320 rather than Postgres's usual 5432, so it cannot collide with a
# Postgres already on the machine (this one has two, on 5432 and 5433).
services:
  db:
    image: postgres:17
    container_name: joblens-db
    environment:
      POSTGRES_USER: joblens
      POSTGRES_PASSWORD: joblens
      POSTGRES_DB: joblens
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - joblens-db:/var/lib/postgresql/data
      # Runs once, when the volume is new: creates the database the tests use.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblens -d joblens"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  joblens-db:
    name: joblens-db
