# Employers' own career sites, read through their sitemap and the schema.org
# JobPosting on each page (src/joblens/sources/careersite.py). Chosen from the
# 5.7 survey of 82 employer domains in the stored links (2026-09-23): 22 had a
# sitemap and a full JobPosting. The counts are vacancy pages in the sitemap.
# `place_in_url` for worldwide sites: a page is fetched only when its URL names
# a place in the chosen provinces.

# 407 pages; industrial automation, software engineers among them
[[careersite]]
site = "wolfgroep.nl"
sitemap = "https://wolfgroep.nl/job-sitemap.xml"
pattern = "/vacature/"
# 275 pages
[[careersite]]
site = "www.werkenbijumcutrecht.nl"
sitemap = "https://www.werkenbijumcutrecht.nl/sitemap.xml"
pattern = "/vacatures/"
# 260 pages
[[careersite]]
site = "www.werkenbijipsedebruggen.nl"
sitemap = "https://www.werkenbijipsedebruggen.nl/sitemap.xml"
pattern = "/vacatures/"
# 53 pages
[[careersite]]
site = "careers.vanlanschotkempen.com"
sitemap = "https://careers.vanlanschotkempen.com/sitemap.xml"
pattern = "/vacatures/"
# 20 pages
[[careersite]]
site = "werkenbijbosman.com"
sitemap = "https://werkenbijbosman.com/sitemap"
pattern = "/vacatures/"
# 2 pages, both data work
[[careersite]]
site = "insightfirst.nl"
sitemap = "https://insightfirst.nl/wp-sitemap-posts-awsm_job_openings-1.xml"
pattern = "/jobs/"
# Teamtailor under the employer's name; 10 pages, Zeeland
[[careersite]]
site = "werkenbij.scalda.nl"
sitemap = "https://werkenbij.scalda.nl/sitemap.xml"
pattern = "/jobs/"
# Teamtailor; 3 pages
[[careersite]]
site = "jobs.thenextchapter.nl"
sitemap = "https://jobs.thenextchapter.nl/sitemap.xml"
pattern = "/jobs/"
# Teamtailor; 4 pages
[[careersite]]
site = "jobs.virtualvaults.com"
sitemap = "https://jobs.virtualvaults.com/sitemap.xml"
pattern = "/jobs/"
# 703 pages worldwide; ING's Workday site is disallowed by its robots.txt, this is not
[[careersite]]
site = "careers.ing.com"
sitemap = "https://careers.ing.com/sitemap.xml"
pattern = "/job/"
place_in_url = true
# 1,389 pages worldwide
[[careersite]]
site = "jobs.paloaltonetworks.com"
sitemap = "https://jobs.paloaltonetworks.com/sitemap.xml"
pattern = "/job/"
place_in_url = true
# 284 pages worldwide
[[careersite]]
