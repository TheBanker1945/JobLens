# Employer boards JobLens reads directly: one request per board per run, and on
# SmartRecruiters one more per new vacancy inside the scope (sources.toml).
#
# Found by scripts/discover_boards.py from the links in stored vacancies,
# checked with one request each, and accepted by a person; the line above each
# entry says what the check found. Adding one by hand works the same way.
# Company boards are public, so this file is committed: a fork gets the list.
#
# Recruitee: slug is "channable" for channable.recruitee.com, or a whole host
# name ("vacatures.coloriet.nl") for a Recruitee board on the employer's domain.
# Greenhouse: the board token from boards-api.greenhouse.io/v1/boards/{slug}.
# SmartRecruiters: the company id from jobs.smartrecruiters.com/{company}/...

# The six boards of 2.3, chosen by hand.
