<!doctype html>
<html lang="%LANG%">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>JobLens</title>
<link rel="stylesheet" href="/assets/app.css">
<script type="module" src="/assets/login.js"></script>
</head>
<body>
<main class="login-page">
<div class="login-card">
<div class="brand">
<span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"></circle><path d="M15 15l5 5"></path></svg></span>
JobLens
</div>
<h1 data-i18n="login.title">Sign in to JobLens</h1>
<p id="message" data-i18n="login.invited">You were invited to try JobLens.</p>
<button type="button" id="go" class="button button-primary" data-i18n="login.button">Sign in</button>
<p id="note" class="login-note" role="status" aria-live="polite"></p>
<p class="muted" data-i18n="login.noPassword">No password needed.</p>
</div>
</main>
</body>
</html>
