<!doctype html>
<html lang="%LANG%">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="joblens-languages" content="%LANGUAGES%">
<title>JobLens</title>
<link rel="stylesheet" href="/assets/app.css">
<script type="module" src="/assets/guide.js"></script>
</head>
<body class="guide-body">
<header class="topbar guide-top">
<a class="brand" href="/">
<span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"></circle><path d="M15 15l5 5"></path></svg></span>
JobLens
</a>
<span class="guide-saved muted" data-i18n="onb.savedAsYouGo">Every answer is saved as you go</span>
<a href="/" id="later" class="skip" data-i18n="onb.later">Finish later</a>
</header>

<main class="flow" data-i18n-attr="aria-label:guide.label">
<div class="meter">
<div class="meter-row"><span id="meter-phase" class="meter-phase"></span><span id="meter-count" class="meter-count"></span></div>
<div class="bar" id="meter-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" data-i18n-attr="aria-label:onb.progress"><div class="bar-fill" id="meter-fill"></div></div>
</div>
<div id="notice" class="notice" role="alert" hidden></div>
<section id="question" class="question" aria-labelledby="q-title"></section>
<div id="progress" class="progress" role="status" aria-live="polite" hidden>
<div id="progress-text"></div>
<div class="bar"><div class="bar-fill" id="progress-fill"></div></div>
</div>
</main>

<div class="flow-actions" id="actions">
<div class="flow-actions-in">
<button type="button" id="back" class="button button-ghost"><span aria-hidden="true">←</span> <span class="flow-back-label" data-i18n="action.back">Back</span></button>
<span class="flow-grow"></span>
<button type="button" id="skip" class="button button-outline" data-i18n="onb.skip">Skip this question</button>
<button type="button" id="next" class="button button-primary" data-i18n="onb.continue">Continue</button>
</div>
</div>
</body>
</html>
