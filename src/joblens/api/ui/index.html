<!doctype html>
<html lang="%LANG%">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="joblens-languages" content="%LANGUAGES%">
<title>JobLens</title>
<link rel="stylesheet" href="/assets/app.css">
<script type="module" src="/assets/dashboard.js"></script>
</head>
<body>
<header class="topbar">
<a class="brand" href="/">
<span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"></circle><path d="M15 15l5 5"></path></svg></span>
JobLens
</a>
<nav class="mainnav" data-i18n-attr="aria-label:nav.label">
<a href="/" aria-current="page" data-i18n="nav.dashboard">Dashboard</a>
</nav>
<div class="topbar-end">
<label class="visually-hidden" for="language" data-i18n="nav.language">Language</label>
<select id="language" class="language"></select>
<div class="account">
<button type="button" id="account-button" class="avatar" aria-haspopup="true" aria-expanded="false" aria-controls="account-menu" data-i18n-attr="aria-label:account.menu"></button>
<div id="account-menu" class="menu" hidden>
<div class="menu-who"><strong id="account-name"></strong><span id="account-email"></span></div>
<a href="/api/me/export" download="joblens-my-data.json" data-i18n="account.download">Download my data</a>
<button type="button" id="sign-out" data-i18n="account.signOut">Sign out</button>
</div>
</div>
</div>
</header>

<main class="dashboard">
<section class="primary">
<div class="hero">
<div class="hero-text">
<div class="hero-date" id="today"></div>
<h1 id="greeting"></h1>
<p id="hero-message"></p>
</div>
<div class="hero-actions">
<button type="button" id="start-match" class="button button-light" hidden></button>
</div>
</div>

<div id="progress" class="progress" role="status" aria-live="polite" hidden>
<div id="progress-text"></div>
<div class="bar"><div class="bar-fill" id="progress-fill"></div></div>
</div>
<div id="notice" class="notice" role="alert" hidden></div>

<div id="stats" class="stats" hidden>
<div class="stat stat-strong"><div class="stat-label" data-i18n="stats.strong">Strong</div><div class="stat-value" id="stat-strong"></div></div>
<div class="stat stat-possible"><div class="stat-label" data-i18n="stats.possible">Possible</div><div class="stat-value" id="stat-possible"></div></div>
<div class="stat stat-weak"><div class="stat-label" data-i18n="stats.weak">Weak</div><div class="stat-value" id="stat-weak"></div></div>
<div class="stat"><div class="stat-label" data-i18n="stats.moved">Moved back</div><div class="stat-value" id="stat-moved"></div></div>
</div>

<div class="section-head">
<h2 data-i18n="matches.title">Your best matches</h2>
<div id="matches-subtitle" class="muted"></div>
</div>
<div id="matches" class="matches"></div>
</section>

<aside class="side">
<section class="card" aria-labelledby="cv-title">
<h2 id="cv-title" data-i18n="cv.title">Your CV</h2>
<div id="cv-current"></div>
<p id="cv-removed" class="card-note" hidden></p>
<button type="button" id="cv-replace" class="button button-outline" data-i18n="cv.replace" hidden>Upload a new version</button>
<form id="cv-form" class="form" hidden>
<label class="field"><span data-i18n="cv.file">CV file</span>
<input type="file" id="cv-file" class="input" name="file" accept=".pdf,.md,.txt">
</label>
<label class="field"><span data-i18n="cv.name">Your name as it is on your CV</span>
<input type="text" id="cv-name" class="input" name="strip_name" autocomplete="name">
</label>
<button type="submit" id="cv-submit" class="button button-primary" data-i18n="cv.upload">Upload</button>
</form>
</section>

<section class="card" aria-labelledby="wishes-title">
<h2 id="wishes-title" data-i18n="wishes.title">What you're looking for</h2>
<div id="wishes" class="chips"></div>
<p class="card-note" data-i18n="wishes.note">If a vacancy doesn't fit, we move it back.</p>
</section>

<section class="card" aria-labelledby="ai-title">
<h2 id="ai-title" data-i18n="ai.title">Your AI</h2>
<div id="ai-model"></div>
<div class="bar" id="ai-bar"><div class="bar-fill" id="ai-fill"></div></div>
<div id="ai-used" class="muted"></div>
</section>
</aside>
</main>
</body>
</html>
