# How should a CV ask the index a question? Compared by scripts/eval_cv_matching.py
# over the labelled CVs in evals/cv-matches/.
#
# cv_style: how the CV becomes one or more queries (src/joblens/cv/documents.py)
#   raw       the redacted CV text, as one query
#   profile   a summary of the extracted fields, shaped like a vacancy document
#   roles     one query per job, plus one for education and skills
#   chunks    the CV cut into overlapping pieces
#   wishlist  an invented advert for the job this person would be hired for next
#
# style: how the VACANCIES are indexed. Fixed at `structured`: 3.1 settled that
# with numbers on this corpus and the brief says not to reopen it without a
# reason. The question here is the other side of the comparison.
#
# The local variants are not there to win. 3.1 found that which document style is
# best is a property of the embedding model rather than of the data -- the
# ordering reversed between qwen3 and gemini-2 -- so a conclusion drawn on one
# model only is not yet a conclusion.

[[run]]
name = "gemini-2 raw CV"
cv_style = "raw"
style = "structured"
provider = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-embedding-2"
api_key_env = "GEMINI_API_KEY"

[[run]]
name = "gemini-2 profile"
cv_style = "profile"
style = "structured"
provider = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-embedding-2"
api_key_env = "GEMINI_API_KEY"

[[run]]
name = "gemini-2 roles"
cv_style = "roles"
style = "structured"
provider = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-embedding-2"
api_key_env = "GEMINI_API_KEY"

[[run]]
name = "gemini-2 chunks"
cv_style = "chunks"
style = "structured"
provider = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-embedding-2"
api_key_env = "GEMINI_API_KEY"

[[run]]
name = "gemini-2 wishlist"
cv_style = "wishlist"
style = "structured"
provider = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-embedding-2"
api_key_env = "GEMINI_API_KEY"

# Fusion (added 2026-09-22): the same vector space, asked two or three ways,
# combined by reciprocal rank fusion (joblens.evals.matching.fuse). Every list
# still asks with a whole CV -- the whole text, the profile, or the advert a
# model writes from it -- so this does not reopen 3.5's "do not split the CV".
#
# The rule, written down before the first run, in the spirit of 3.5's: a fused
# variant replaces `raw` only if its worst nDCG@10 over the scored CVs beats
# raw's, AND it does no worse than raw on the one CV labelled by the person it
# belongs to. The invented CVs are labelled by Claude; that one is not.

[[run]]
name = "gemini-2 raw + wishlist"
cv_style = "raw"
fuse_with = ["wishlist"]
style = "structured"
provider = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-embedding-2"
api_key_env = "GEMINI_API_KEY"

[[run]]
name = "gemini-2 raw + profile"
cv_style = "raw"
fuse_with = ["profile"]
style = "structured"
provider = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-embedding-2"
api_key_env = "GEMINI_API_KEY"

[[run]]
name = "gemini-2 raw + roles"
cv_style = "raw"
fuse_with = ["roles"]
style = "structured"
provider = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-embedding-2"
api_key_env = "GEMINI_API_KEY"

[[run]]
name = "gemini-2 raw + profile + wishlist"
cv_style = "raw"
fuse_with = ["profile", "wishlist"]
style = "structured"
provider = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-embedding-2"
api_key_env = "GEMINI_API_KEY"

[[run]]
name = "local raw CV"
cv_style = "raw"
style = "structured"
provider = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3-embedding:0.6b"

[[run]]
name = "local profile"
cv_style = "profile"
style = "structured"
provider = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3-embedding:0.6b"

[[run]]
name = "local roles"
cv_style = "roles"
style = "structured"
provider = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3-embedding:0.6b"
