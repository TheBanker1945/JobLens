# Settings compared by scripts/eval_extraction.py. Each [[run]] is evaluated over all
# samples in data/samples/vacancies/ against data/samples/expected/.
#
# To add a cloud model: set api_key_env to the NAME of an env var in .env
# (e.g. "OPENROUTER_API_KEY"). Never put a key in this file.

[[run]]
name = "qwen3:8b schema"
provider = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3:8b"
thinking = false
mode = "schema"

[[run]]
name = "qwen3:8b prompt"
provider = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3:8b"
thinking = false
mode = "prompt"

[[run]]
name = "qwen3:8b schema +think"
provider = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3:8b"
thinking = true
mode = "schema"

[[run]]
name = "qwen3:8b prompt +think"
provider = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3:8b"
thinking = true
mode = "prompt"
