# Search variants compared by scripts/eval_retrieval.py, over one of the two
# corpora in joblens.corpus and the matching query file in evals/queries/.
#
# style: raw (the vacancy text), structured (summary of the extracted fields),
#        title_only (just the job title), structured_raw (the summary, then the text).
# instruction: false embeds the query as plain text, to show what the model's
#        query instruction is worth (only qwen3-embedding has one).
#
# Cloud embeddings are allowed for CV matching too since 2026-09-21 (CLAUDE.md), so
# these variants are candidates for the whole corpus, not just for vacancy search.
# On the real corpus `gemini-2 structured` wins and `gemini-2 raw` -- the winner on
# the fictional samples -- comes last: see the 3.1 entry in docs/learning-log.md
# before reading anything into the sample numbers.

[[run]]
name = "local raw"
style = "raw"
provider = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3-embedding:0.6b"

[[run]]
name = "local structured"
style = "structured"
provider = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3-embedding:0.6b"

[[run]]
name = "local title only"
style = "title_only"
provider = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3-embedding:0.6b"

[[run]]
name = "local structured, no instruction"
style = "structured"
provider = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3-embedding:0.6b"
instruction = false

[[run]]
name = "gemini-001 structured"
style = "structured"
provider = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-embedding-001"
api_key_env = "GEMINI_API_KEY"

[[run]]
name = "gemini-2 structured"
style = "structured"
provider = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-embedding-2"
api_key_env = "GEMINI_API_KEY"

[[run]]
name = "gemini-2 raw"
style = "raw"
provider = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-embedding-2"
api_key_env = "GEMINI_API_KEY"

[[run]]
name = "local structured + raw"
style = "structured_raw"
provider = "ollama"
base_url = "http://localhost:11434/v1"
model = "qwen3-embedding:0.6b"
